name: CI/CD sécurité

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]

# Aucune permission par défaut : chaque job déclare le strict nécessaire.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"  # aligné sur l'image runtime (Chainguard Python 3.14)
  PLATFORM: linux/amd64
  # Outils téléchargés directement : version et SHA256 épinglés
  # (empreintes relevées sur les releases GitHub officielles).
  HADOLINT_VERSION: v2.15.1
  HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
  DIVE_VERSION: 0.13.1
  DIVE_SHA256: 0970549eb4a306f8825a84145a2534153badb4d7dcf3febd1967c706367c3d0e
  TRIVY_VERSION: 0.75.0
  TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f

jobs:
  python-quality:
    name: Flake8 + tests unitaires
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer les dépendances
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Flake8
        run: flake8 --config=.flake8 app.py test_app.py tests scripts

      - name: Tests unitaires (sans base de données)
        run: pytest -m "not integration"

  dockerfile-pinning:
    name: Hadolint + pinning
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Hadolint (checksum vérifié)
        run: |
          curl -fsSLo hadolint \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum --check --strict
          sudo install -m 0755 hadolint /usr/local/bin/hadolint
          rm hadolint

      - name: Hadolint
        run: hadolint --config .hadolint.yaml Dockerfile

      - name: Images et actions épinglées
        # `compose config` ne lance aucun conteneur : il résout seulement le YAML.
        run: |
          docker compose config --no-interpolate --format json \
            | python3 scripts/ci/check_pinning.py --compose-json -

  build:
    name: BuildKit + Dive
    needs: [python-quality, dockerfile-pinning]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
      image-id: ${{ steps.export.outputs.image-id }}
      archive-sha256: ${{ steps.export.outputs.archive-sha256 }}
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nommer l'image
        id: meta
        run: |
          echo "image=flask-api:ci-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "artifact=api-image-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Construire avec BuildKit
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        # Image mono-plateforme sans attestations : le digest publié
        # correspondra exactement à l'image auditée.
        run: |
          docker buildx build \
            --platform "$PLATFORM" \
            --provenance=false --sbom=false \
            --load \
            --tag "$IMAGE" \
            .

      - name: Installer Dive (checksum vérifié)
        run: |
          archive="dive_${DIVE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/wagoodman/dive/releases/download/v${DIVE_VERSION}/${archive}"
          echo "${DIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" dive
          sudo install -m 0755 dive /usr/local/bin/dive
          rm dive "$archive"

      - name: Dive (efficacité >= 80 %)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: dive --ci --ci-config .dive-ci "$IMAGE"

      - name: Exporter l'image
        id: export
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          mkdir -p dist
          docker save --output dist/image.tar "$IMAGE"
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          archive_sha256="$(sha256sum dist/image.tar | cut -d' ' -f1)"
          printf '%s\n' "$IMAGE" > dist/image-name.txt
          printf '%s\n' "$image_id" > dist/image-id.txt
          printf '%s  image.tar\n' "$archive_sha256" > dist/image.tar.sha256
          echo "image-id=$image_id" >> "$GITHUB_OUTPUT"
          echo "archive-sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### Image construite"
            echo "- Tag local : \`$IMAGE\`"
            echo "- Image ID : \`$image_id\`"
            echo "- SHA256 archive : \`$archive_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  trivy:
    name: Trivy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image-id }}
      EXPECTED_SHA256: ${{ needs.build.outputs.archive-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Vérifier et charger l'image auditée
        run: scripts/ci/load_verified_image.sh dist

      - name: Installer Trivy (checksum vérifié)
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          rm trivy "$archive"

      - name: Rapports complets (toutes sévérités, non bloquant)
        run: |
          mkdir -p reports
          trivy image --input dist/image.tar --scanners vuln \
            --format json --output reports/trivy-image-full.json
          trivy image --input dist/image.tar --scanners vuln --skip-db-update \
            --format table --output reports/trivy-image-full.txt
          trivy fs --scanners vuln --skip-db-update --skip-dirs dist,reports \
            --format json --output reports/trivy-deps-full.json .

      - name: Gate image (HIGH/CRITICAL corrigibles)
        run: |
          trivy image --input dist/image.tar --scanners vuln --skip-db-update \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --format table

      - name: Gate dépendances runtime (requirements.txt)
        if: ${{ !cancelled() }}
        run: |
          trivy fs --scanners vuln --skip-db-update --skip-dirs dist,reports \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --format table .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: trivy-reports-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  integration:
    name: Compose + pytest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      API_IMAGE: ${{ needs.build.outputs.image }}
      IMAGE: ${{ needs.build.outputs.image }}
      EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image-id }}
      EXPECTED_SHA256: ${{ needs.build.outputs.archive-sha256 }}
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
      API_BASE_URL: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Vérifier et charger l'image auditée
        run: scripts/ci/load_verified_image.sh dist

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer les outils de test
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Identifiants éphémères de la base CI
        # Générés pour ce run uniquement, masqués dans les logs, jamais réutilisés.
        run: |
          db_password="$(openssl rand -hex 24)"
          echo "::add-mask::$db_password"
          {
            echo "DB_USER=ci_user"
            echo "DB_NAME=ci_db"
            echo "DB_PASSWORD=$db_password"
          } >> "$GITHUB_ENV"

      - name: Démarrer la stack (image auditée, sans build)
        run: docker compose up -d --no-build --wait --wait-timeout 120

      - name: Vérifier l'état healthy
        run: |
          for service in api-python db; do
            container="$(docker compose ps --quiet "$service")"
            status="$(docker inspect --format \
              '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
              "$container")"
            echo "$service: $status"
            [ "$status" = "healthy" ] || exit 1
          done
          running_image="$(docker inspect --format '{{.Image}}' \
            "$(docker compose ps --quiet api-python)")"
          [ "$running_image" = "$EXPECTED_IMAGE_ID" ] || {
            echo "::error::api-python n'exécute pas l'image auditée ($running_image)"
            exit 1
          }

      - name: Tests d'intégration HTTP
        run: pytest -m integration tests/integration

      - name: Diagnostic en cas d'échec
        if: ${{ failure() }}
        # Les valeurs masquées (mot de passe) restent masquées dans ces sorties.
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps --tail 200

      - name: Nettoyage
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans

  release:
    name: Release GHCR
    needs: [python-quality, dockerfile-pinning, build, trivy, integration]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # Une seule publication à la fois, jamais annulée en cours de route.
    concurrency:
      group: ghcr-release
      cancel-in-progress: false
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image-id }}
      EXPECTED_SHA256: ${{ needs.build.outputs.archive-sha256 }}
      TAG: ${{ github.ref_name }}
    outputs:
      repository: ${{ steps.version.outputs.repository }}
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Valider le tag SemVer stable
        id: version
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag invalide '$TAG' : format attendu vX.Y.Z"
            exit 1
          fi
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"
          {
            echo "version=$major.$minor.$patch"
            echo "minor=$major.$minor"
            echo "major=$major"
            echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Vérifier l'origine et l'ordre de la release
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Le commit $GITHUB_SHA n'appartient pas à l'historique de main"
            exit 1
          }
          latest="$(git tag --list 'v*' \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | sort -V | tail -n 1)"
          if [ "$latest" != "$TAG" ]; then
            echo "::error::$TAG n'est pas la release stable la plus récente ($latest)."
            echo "::error::Les alias X et X.Y ne doivent pas reculer."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Vérifier et charger l'image auditée
        run: scripts/ci/load_verified_image.sh dist

      - name: Connexion à GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" \
            | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Refuser d'écraser une version publiée
        env:
          REPOSITORY: ${{ steps.version.outputs.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker manifest inspect "$REPOSITORY:$VERSION" > /dev/null 2>&1; then
            echo "::error::$REPOSITORY:$VERSION existe déjà ; publier une nouvelle version."
            exit 1
          fi

      - name: Retaguer et publier l'image auditée
        id: push
        env:
          REPOSITORY: ${{ steps.version.outputs.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          for tag in "$VERSION" "$MINOR" "$MAJOR"; do
            docker tag "$IMAGE" "$REPOSITORY:$tag"
            docker push "$REPOSITORY:$tag"
          done
          digest="$(docker buildx imagetools inspect "$REPOSITORY:$VERSION" \
            --format '{{json .Manifest}}' | jq -r .digest)"
          for tag in "$MINOR" "$MAJOR"; do
            alias_digest="$(docker buildx imagetools inspect "$REPOSITORY:$tag" \
              --format '{{json .Manifest}}' | jq -r .digest)"
            [ "$alias_digest" = "$digest" ] || {
              echo "::error::$REPOSITORY:$tag ne pointe pas vers $digest"
              exit 1
            }
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Image publiée"
            echo "- Tags : \`$VERSION\`, \`$MINOR\`, \`$MAJOR\`"
            echo "- Digest : \`$REPOSITORY@$digest\`"
            echo "- Image ID auditée : \`$EXPECTED_IMAGE_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Déconnexion de GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io

  verify-publication:
    name: Pull public + smoke test
    needs: release
    runs-on: ubuntu-24.04
    # Aucun jeton : le pull doit fonctionner anonymement (package public).
    permissions: {}
    env:
      REPOSITORY: ${{ needs.release.outputs.repository }}
      VERSION: ${{ needs.release.outputs.version }}
      DIGEST: ${{ needs.release.outputs.digest }}
    steps:
      - name: Pull anonyme par tag et par digest
        run: |
          docker pull "$REPOSITORY:$VERSION" || {
            echo "::error::Pull anonyme impossible : rendre le package GHCR public."
            exit 1
          }
          docker pull "$REPOSITORY@$DIGEST"
          by_tag="$(docker image inspect --format '{{.Id}}' "$REPOSITORY:$VERSION")"
          by_digest="$(docker image inspect --format '{{.Id}}' "$REPOSITORY@$DIGEST")"
          [ "$by_tag" = "$by_digest" ] || {
            echo "::error::Le tag $VERSION et le digest ne désignent pas la même image"
            exit 1
          }

      - name: Smoke test de l'image récupérée
        run: |
          docker run --detach --name smoke --publish 127.0.0.1:5000:5000 \
            "$REPOSITORY@$DIGEST"
          for _ in $(seq 1 30); do
            if body="$(curl -fsS --max-time 2 http://127.0.0.1:5000/health)"; then
              echo "$body"
              [ "$(jq -r .status <<< "$body")" = "ok" ] && exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: Nettoyage
        if: ${{ always() }}
        run: docker rm --force smoke || true
