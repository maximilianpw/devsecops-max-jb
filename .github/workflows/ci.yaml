name: CI/CD sécurité

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]

# Aucune permission par défaut : chaque job déclare le strict nécessaire.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.15"  # aligné sur l'image runtime (Chainguard Python 3.15)
  PLATFORM: linux/amd64
  # Outils téléchargés directement : version et SHA256 épinglés
  # (empreintes relevées sur les releases GitHub officielles).
  HADOLINT_VERSION: v2.15.1
  HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
  DIVE_VERSION: 0.13.1
  DIVE_SHA256: 0970549eb4a306f8825a84145a2534153badb4d7dcf3febd1967c706367c3d0e
  TRIVY_VERSION: 0.75.0
  TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f

jobs:
  python-quality:
    name: Flake8 + tests unitaires
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer les dépendances
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Flake8
        run: flake8 --config=.flake8 app.py test_app.py tests scripts

      - name: Tests unitaires (sans base de données)
        run: pytest -m "not integration"

  dockerfile-pinning:
    name: Hadolint + pinning
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Hadolint (checksum vérifié)
        run: |
          curl -fsSLo hadolint \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum --check --strict
          sudo install -m 0755 hadolint /usr/local/bin/hadolint
          rm hadolint

      - name: Hadolint
        run: hadolint --config .hadolint.yaml Dockerfile

      - name: Politique Hadolint (règles d'équipe testées)
        # Hadolint ignore sans erreur un code de règle mal saisi : chaque règle
        # d'équipe est rejouée sur un Dockerfile fautif et doit bloquer en error.
        run: python3 scripts/ci/check_hadolint_policy.py

      - name: Images et actions épinglées
        # `compose config` ne lance aucun conteneur : il résout seulement le YAML.
        run: |
          docker compose config --no-interpolate --format json \
            | python3 scripts/ci/check_pinning.py --compose-json - --require-tp2

  build-amd64:
    needs: [python-quality, dockerfile-pinning]
    permissions:
      contents: read
    uses: ./.github/workflows/tp2-build.yaml
    with:
      arch: amd64
      runner: ubuntu-24.04
  build-arm64:
    needs: [python-quality, dockerfile-pinning]
    permissions:
      contents: read
    uses: ./.github/workflows/tp2-build.yaml
    with:
      arch: arm64
      runner: ubuntu-24.04-arm
  scan-amd64:
    needs: build-amd64
    permissions:
      contents: read
    uses: ./.github/workflows/tp2-scan.yaml
    with:
      arch: amd64
      image: ${{ needs.build-amd64.outputs.image }}
      image-id: ${{ needs.build-amd64.outputs.image-id }}
      archive-sha256: ${{ needs.build-amd64.outputs.archive-sha256 }}
      artifact-id: ${{ needs.build-amd64.outputs.artifact-id }}
      run-attempt: ${{ needs.build-amd64.outputs.run-attempt }}
  scan-arm64:
    needs: build-arm64
    permissions:
      contents: read
    uses: ./.github/workflows/tp2-scan.yaml
    with:
      arch: arm64
      image: ${{ needs.build-arm64.outputs.image }}
      image-id: ${{ needs.build-arm64.outputs.image-id }}
      archive-sha256: ${{ needs.build-arm64.outputs.archive-sha256 }}
      artifact-id: ${{ needs.build-arm64.outputs.artifact-id }}
      run-attempt: ${{ needs.build-arm64.outputs.run-attempt }}
  build:
    name: BuildKit + Dive
    if: ${{ always() }}
    needs: [build-amd64, build-arm64, scan-amd64, scan-arm64]
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success") and .["build-amd64"].outputs.platform == "linux/amd64" and .["build-arm64"].outputs.platform == "linux/arm64"' <<< "$NEEDS"
  trivy:
    name: Trivy
    if: ${{ always() }}
    needs: [scan-amd64, scan-arm64]
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'length == 2 and all(.[]; .result == "success")' <<< "$NEEDS"
  integration:
    name: Compose + pytest
    if: ${{ always() }}
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success") and .["build-amd64"].outputs.platform == "linux/amd64" and .["build-arm64"].outputs.platform == "linux/arm64"' <<< "$NEEDS"
  release:
    name: Publish validated multi-platform index
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [python-quality, dockerfile-pinning, build, trivy, integration, build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-release
      cancel-in-progress: false
    outputs:
      repository: ${{ steps.version.outputs.repository }}
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      major: ${{ steps.version.outputs.major }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release ancestry, SemVer and alias order before writes
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          latest=$(git tag --list 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1)
          test "$latest" = "$TAG"
          {
            echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "version=$major.$minor.$patch"
            echo "minor=$major.$minor"
            echo "major=$major"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build-amd64.outputs.artifact-id }}
          path: dist/amd64
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build-arm64.outputs.artifact-id }}
          path: dist/arm64
          merge-multiple: true
      - name: Verify amd64 archive
        env:
          EXPECTED_IMAGE_ID: ${{ needs.build-amd64.outputs.image-id }}
          EXPECTED_SHA256: ${{ needs.build-amd64.outputs.archive-sha256 }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.build-amd64.outputs.run-attempt }}
          EXPECTED_PLATFORM: linux/amd64
        run: python3 scripts/ci/image_archive.py verify dist/amd64
      - name: Verify arm64 archive
        env:
          EXPECTED_IMAGE_ID: ${{ needs.build-arm64.outputs.image-id }}
          EXPECTED_SHA256: ${{ needs.build-arm64.outputs.archive-sha256 }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.build-arm64.outputs.run-attempt }}
          EXPECTED_PLATFORM: linux/arm64
        run: python3 scripts/ci/image_archive.py verify dist/arm64
      - run: scripts/ci/install_tools.sh crane
      - name: Authenticate to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push archives and promote verified index without rebuilding
        id: push
        env:
          REPOSITORY: ${{ steps.version.outputs.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
          MAJOR: ${{ steps.version.outputs.major }}
          AMD64_ID: ${{ needs.build-amd64.outputs.image-id }}
          ARM64_ID: ${{ needs.build-arm64.outputs.image-id }}
        run: scripts/ci/publish_index.sh
      - name: Log out
        if: ${{ always() }}
        run: docker logout ghcr.io
  verify-publication:
    name: Anonymous pull and native smoke test
    needs: [release, build-amd64, build-arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions: {}
    env:
      REPOSITORY: ${{ needs.release.outputs.repository }}
      VERSION: ${{ needs.release.outputs.version }}
      MINOR: ${{ needs.release.outputs.minor }}
      MAJOR: ${{ needs.release.outputs.major }}
      DIGEST: ${{ needs.release.outputs.digest }}
      EXPECTED_ID: ${{ matrix.arch == 'amd64' && needs.build-amd64.outputs.image-id || needs.build-arm64.outputs.image-id }}
      PLATFORM: linux/${{ matrix.arch }}
    steps:
      - name: Pull and smoke test every published reference without credentials
        run: |
          DOCKER_CONFIG=$(mktemp -d)
          export DOCKER_CONFIG
          cleanup() { docker rm -f tp2-smoke >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"; }
          trap cleanup EXIT
          for ref in "$REPOSITORY:$VERSION" "$REPOSITORY:$MINOR" "$REPOSITORY:$MAJOR" "$REPOSITORY@$DIGEST"; do
            docker pull --platform "$PLATFORM" "$ref"
            docker run --detach --name tp2-smoke --platform "$PLATFORM" --publish 127.0.0.1:5000:5000 "$ref"
            ok=false
            for _ in $(seq 1 30); do
              if curl -fsS --max-time 2 http://127.0.0.1:5000/health | jq -e '.status == "ok"'; then ok=true; break; fi
              sleep 1
            done
            test "$ok" = true
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$ref")" = "$PLATFORM"
            docker save -o "$DOCKER_CONFIG/image.tar" "$ref"
            python3 - "$DOCKER_CONFIG/image.tar" "$EXPECTED_ID" <<'PY'
          import hashlib, json, sys, tarfile
          with tarfile.open(sys.argv[1]) as archive:
              manifest = json.load(archive.extractfile('manifest.json'))[0]
              config = archive.extractfile(manifest['Config']).read()
              assert 'sha256:' + hashlib.sha256(config).hexdigest() == sys.argv[2]
          PY
            docker rm -f tp2-smoke
          done
